<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <p>Unordered List:list and group related items for better readability</p>
    <ul style="list-style-type:circle;">
        <li>apple</li>
        <li>banana</li>
        <li>grapes</li>
        </ul>
    <ul style="list-style-type:square;">
        <li>apple</li>
        <li>banana</li>
        <li>grapes</li>
        </ul>    
    <ul style="list-style-type:lower-latin;">
        <li>apple</li>
        <li>banana</li>
        <li>grapes</li>
        </ul>    
    <ol>
        <li>grill</li>
        <li>sump</li>
        <li>engine</li>
    </ol>
     <ol start="4">
        <li>grill</li>
        <li>sump</li>
        <li>engine</li>
    </ol>
     <ol type="I">
        <li>grill</li>
        <li>sump</li>
        <li>engine</li>
    </ol>

</body>
</html>
