<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
     <style>
        .Style1 {
            font-size: 20px;
            background-color: lightblue;
            color: blanchedalmond;
        }
        
        
        .Style2 {
            color:cyan; 
        }
        .Style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        </style>
</head>
<body>
    <h1 class="Style1">class selector</h1>
    <h1 class="Style2">Heading tag itself;But a different style</h1>
    <p class="Style3">This is a paragraph that i have created</p>
    <p class="Style2">This is second paragraph</p>

</body>
</html>
